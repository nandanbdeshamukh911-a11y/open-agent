name: CI
on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Install Chromium for browser integration tests
        if: runner.os == 'Windows'
        run: python -m playwright install chromium --only-shell
      - name: Test the browser against a local fixture
        if: runner.os == 'Windows'
        env:
          OPEN_AGENT_TEST_BROWSER: '1'
        run: python -m pytest -q tests/test_browser.py tests/test_design.py
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
